<div class="modal-header">
  <h2 class="modal-title h5">{% if technique %}Editar técnica{% else %}Nova técnica{% endif %}</h2>
  <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<form class="modal-body"
      hx-post="{% if technique %}{% url 'characters:player_technique_update' character.campaign.slug technique.pk %}{% else %}{% url 'characters:player_technique_create' character.campaign.slug %}{% endif %}"
      hx-target="#player-technique-list"
      hx-swap="outerHTML">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Salvar</button>
</form>
