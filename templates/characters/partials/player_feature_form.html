<div class="modal-header">
  <h2 class="modal-title h5">{% if feature %}Editar característica{% else %}Nova característica{% endif %}</h2>
  <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<form class="modal-body"
      hx-post="{% if feature %}{% url 'characters:player_feature_update' character.campaign.slug feature.pk %}{% else %}{% url 'characters:player_feature_create' character.campaign.slug %}{% endif %}"
      hx-target="#player-feature-sections"
      hx-swap="outerHTML">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Salvar</button>
</form>
