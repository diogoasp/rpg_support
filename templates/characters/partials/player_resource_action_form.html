<div class="modal-header">
  <h2 class="modal-title h5">{{ title }} · {{ character.name }}</h2>
  <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<form class="modal-body op-mobile-action-form"
      hx-post="{% if resource == 'hp' %}{% if action == 'damage' %}{% url 'characters:player_damage' character.campaign.slug %}{% else %}{% url 'characters:player_heal' character.campaign.slug %}{% endif %}{% else %}{% if action == 'spend' %}{% url 'characters:player_pp_spend' character.campaign.slug %}{% else %}{% url 'characters:player_pp_recover' character.campaign.slug %}{% endif %}{% endif %}"
      hx-target="#player-resource-panel"
      hx-swap="outerHTML">
  {% csrf_token %}
  <p class="op-mobile-current">
    {% if resource == 'hp' %}
      PV atual: <strong>{{ character.current_hp }}/{{ character.max_hp }}</strong>
    {% else %}
      PP atual: <strong>{{ character.current_power_points }}/{{ character.max_power_points }}</strong>
    {% endif %}
  </p>
  {% for field in form %}
    <label class="op-mobile-field">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.errors %}<small class="op-form-errors">{{ field.errors }}</small>{% endif %}
    </label>
  {% endfor %}
  <button class="btn op-mobile-submit {% if action == 'damage' or action == 'spend' %}btn-danger{% else %}btn-success{% endif %}" type="submit">Aplicar</button>
</form>
