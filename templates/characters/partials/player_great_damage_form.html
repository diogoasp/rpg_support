<div class="modal-header">
  <h2 class="modal-title h5">Recuperação de grande dano</h2>
  <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<form class="modal-body op-mobile-action-form"
      hx-post="{% url 'characters:player_great_damage_recovery' character.campaign.slug %}"
      hx-target="#player-rest-panel"
      hx-swap="outerHTML">
  {% csrf_token %}
  <p class="op-mobile-current">PV atual: <strong>{{ character.current_hp }}/{{ character.max_hp }}</strong></p>
  {% for field in form %}
    <label class="op-mobile-field">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.errors %}<small class="op-form-errors">{{ field.errors }}</small>{% endif %}
    </label>
  {% endfor %}
  <button class="btn op-mobile-submit btn-pirate-red" type="submit">Iniciar recuperação</button>
</form>
